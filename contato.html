<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link para o CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- Ícone do site -->
    <link rel="shortcut icon" href="./assets/img/favicon.png" type="image/x-icon">

    <!-- Link da fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- BoxIcons -->
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <title>Contato | NEXO Web</title>
</head>

<body>

    <header>
        <div class="container">
            <a href="#topo">
                <img src="./assets/img/favicon.png" alt="NEXO Web">
            </a>
            <nav>
                <a href="./sobre.html">Sobre</a>
                <a href="./servicos.html">Serviços</a>
                <a href="./como-funciona.html">Como Funciona</a>
                <a href="./projetos.html">Projetos</a>
            </nav>

            <div class="header-botao">
                <a href="./contato.html" class="btn-header">Fale Conosco</a>
            </div>
        </div>
    </header>



    <!-- CONTATO -->
    <main>

        <section id="contato">

            <div class="container-full">
                <figure><img src="./assets/img/site.png" alt="Logo NEXO Web"></figure>

                <div class="contato-form">

                    <h1>Entre em contato</h1>

                    <p>
                        Preencha o formulário abaixo e fale com a NEXO Web.
                    </p>

                    <form action="https://api.web3forms.com/submit" method="POST">

                        <input type="hidden" name="access_key" value="d2591170-7ac7-4757-8c9d-517b4a24d63e">

                        <div class="campo">
                            <label for="name">Nome</label>
                            <input type="text" id="name" name="name" placeholder="Digite seu nome" required>
                        </div>

                        <div class="campo">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                        </div>

                        <div class="campo">
                            <label for="subject">Assunto</label>
                            <input type="text" id="subject" name="subject" placeholder="Digite o assunto" required>
                        </div>

                        <div class="campo">
                            <label for="message">Mensagem</label>
                            <textarea id="message" name="message" rows="6" placeholder="Digite sua mensagem"
                                required></textarea>
                        </div>

                        <button type="submit">
                            Enviar mensagem
                        </button>

                    </form>

                </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer>

        <div class="footerLogo">
            <img src="./assets/img/header.png" alt="Logo NEXO Web">

            <p>
                2026 NEXO Web - Todos os direitos reservados.
            </p>
        </div>

        <div class="footerContato">
            <p>Telefone: 11 99999-9999</p>
            <p>Instagram: @nexoweb</p>
            <p>Contato: Faça seu pedido conosco!</p>
        </div>

    </footer>

</body>

</html>
